# Bitta buyruq bilan ishga tushirish:
#   docker compose up
# Keyin brauzerda: http://localhost:3000  (PIN 0000)
#
# Baza konteyner ichida emas, `pgdata` papkasida saqlanadi — konteyner
# o'chirilsa ham ma'lumot qoladi.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scandi
      POSTGRES_PASSWORD: scandi
      POSTGRES_DB: scandi_erp
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scandi -d scandi_erp"]
      interval: 3s
      timeout: 3s
      retries: 20

  erp:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --omit=dev && node erp/server.js"
    environment:
      DATABASE_URL: postgresql://scandi:scandi@db:5432/scandi_erp
      PGSSL: "off"                # lokal baza, SSL kerak emas
      ERP_AUTO_MIGRATE: "1"       # bazani o'zi yaratadi
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # node_modules konteyner ichida qoladi — kompyuteringizdagi papka bilan
      # aralashib ketmasligi uchun
      - erp_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  erp_node_modules:
