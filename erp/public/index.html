<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scandi ERP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Scandi ERP</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div class="grid g3" id="pages"></div>

<div class="card" style="margin-top:16px">
  <h2>Modullar</h2>
  <div id="modules" class="grid g3"></div>
</div>

<script>
const $ = id => document.getElementById(id);

const PAGES = [
  { href:'/jurnal.html', title:'Ishlab chiqarish jurnali', lead:'Konveyer raqami bo\'yicha',
    text:"Har mahsulot: sana, konveyer №, zakaz №, tsex, bo'lim, mijoz, narx, muddatlar",
    perm:['production.view'] },
  { href:'/qoldiq.html', title:"Boshlang'ich qoldiq", lead:'Bir martalik kiritish',
    text:"Tizim ishga tushgan kundagi konveyerdagi va T/M omboridagi mahsulotlar",
    perm:['production.units','production.manage'] },
  { href:'/mijozlar.html', title:'Mijozlar', lead:'Ro\'yxat va kanal tahlili',
    text:"Mijoz nomi, region, telefon, kanal · qaysi kanal qancha sotuv keltirdi",
    perm:['production.view'] },
  { href:'/zavod.html', title:"Zavod ko'rinishi", lead:'Nima qayerda',
    text:"Har mahsulot qaysi tsex va bo'limda · qachon keyingi tsexga o'tadi · qachon omborga kiradi",
    perm:['production.view'] },
  { href:'/dashboard.html', title:'Boshqaruv paneli', lead:"Ko'rsatkichlar",
    text:"Reja/fakt · bottleneck · komplektlilik · umumiy tsex yuklamasi · Pareto",
    perm:['production.view'] },
  { href:'/smena.html', title:'Smena kiritish', lead:'Tsex boshliqlari uchun',
    text:"Bir tsexning barcha bo'limlari bo'yicha kunlik ma'lumotni bitta jadvalda kiritish",
    perm:['production.entry'] },
  { href:'/terminal.html', title:"Bo'lim terminali", lead:'Tsex planshetlari',
    text:"Dona qayd etish · brak · to'xtash · kamera partiyasi",
    perm:['production.entry'] },
  { href:'/xodimlar.html', title:'Xodimlar', lead:'Rollar va kirish',
    text:"Xodim qo'shish, PIN berish, rol va tsex biriktirish",
    perm:['admin.users'] },
  { href:'/katalog.html', title:'Katalog', lead:'Mahsulot nomi va guruhi',
    text:"Fason, guruh va marshrut \u2014 yangi mahsulot qo'shish uchun kod tegilmaydi",
    perm:['production.manage'] },
  { href:'/sozlamalar.html', title:'Bo\'lim quvvati', lead:'Muddat bashorati',
    text:"Har bo'limning kunlik quvvati — muddat hisobi shunga tayanadi",
    perm:['production.manage'] },
];

App.start(async () => {
  $('pages').innerHTML = PAGES.filter(p => App.can(...p.perm)).map(p => `
    <a class="card" href="${p.href}" style="text-decoration:none;color:inherit">
      <h2>${p.title}</h2>
      <p style="font-size:18px;font-weight:500">${p.lead}</p>
      <p class="muted" style="margin-top:8px">${p.text}</p></a>`).join('');

  const mods = await App.api('/api/modules');
  $('modules').innerHTML = mods.map(m => `
    <div class="card" style="background:var(--surface-2)">
      <div class="row" style="justify-content:space-between">
        <strong>${m.name}</strong>
        <span class="tag ${m.ready ? 'ok' : ''}">${m.ready ? 'ishlayapti' : 'rejada'}</span>
      </div>
    </div>`).join('') || '<p class="muted">Ochiq modul yo\'q</p>';
});
</script>
</body>
</html>
