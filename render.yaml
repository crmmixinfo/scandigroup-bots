# Render.com uchun blueprint: veb-xizmat va Postgres birga yaratiladi.
# Render'da: New -> Blueprint -> shu repozitoriyni tanlang.
services:
  - type: web
    name: scandi-erp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node erp/server.js
    healthCheckPath: /health
    envVars:
      - key: ERP_AUTO_MIGRATE
        value: "1"
      - key: SESSION_DAYS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: scandi-erp-db
          property: connectionString

databases:
  - name: scandi-erp-db
    plan: basic-256mb
    postgresMajorVersion: "16"
